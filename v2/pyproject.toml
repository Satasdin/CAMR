[project]
name = "camr-engine"
version = "0.0.1"
description = "Memory that lives on the SSD and grows: a small local model that keeps getting better, never heavier."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ibrahim Sudheysi Ali" }]
dependencies = [
  "numpy>=1.26",
  "mlx>=0.29; sys_platform == 'darwin'",
  "mlx-lm>=0.28; sys_platform == 'darwin'",
  "regex>=2024.0",
]

[project.optional-dependencies]
# the old CAMR contender; camr itself is installed from ~/Desktop/camr-repo (uv pip install --no-deps -e)
baseline = ["pyyaml>=6.0", "requests>=2.31", "sqlite-vec>=0.1.6"]
dev = ["pytest>=8"]
# benchmarks: the Claude yardstick and the Hugging Face suites
bench = ["anthropic>=2.4", "pyarrow>=26", "sympy>=1.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["camr_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
camr_engine = ["app/static/**/*"]
