<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Queue Board</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #1e293b;
            --card: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        main {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }
        .card {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }
        h1 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        button:active { opacity: 0.8; }
        .status-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        #now {
            font-size: 1.5rem;
            font-weight: bold;
            color: #059669;
            min-height: 1.5em;
        }
        #count {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        #queue {
            padding-left: 1.5rem;
        }
        #queue li {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            border-bottom: 1px solid #f1f5f9;
        }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <h1>Clinic Queue Board</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="name">Patient Name</label>
                <input type="text" id="name" placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label for="reason">Reason</label>
                <select id="reason">
                    <option value="Consultation">Consultation</option>
                    <option value="Pharmacy">Pharmacy</option>
                    <option value="Lab">Lab</option>
                </select>
            </div>
            <button type="button" id="add">Add to Queue</button>
        </div>

        <div class="card">
            <div class="status-area">
                <div>
                    <div>Current:</div>
                    <div id="now">None</div>
                </div>
                <div style="text-align: right;">
                    <div>Waiting:</div>
                    <div id="count">0</div>
                </div>
            </div>
            <button type="button" id="next" style="width: 100%; margin-bottom: 1rem;">Call Next Patient</button>
            <ol id="queue"></ol>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'clinic-queue';
        
        // State
        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
            queue: [],
            current: null
        };

        // Elements
        const nameInput = document.getElementById('name');
        const reasonInput = document.getElementById('reason');
        const addBtn = document.getElementById('add');
        const nextBtn = document.getElementById('next');
        const queueList = document.getElementById('queue');
        const countDisplay = document.getElementById('count');
        const nowDisplay = document.getElementById('now');

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function render() {
            // Update Count
            countDisplay.textContent = state.queue.length;
            
            // Update Current
            nowDisplay.textContent = state.current || 'None';
            
            // Update List
            queueList.innerHTML = '';
            state.queue.forEach((patient, index) => {
                const li = document.createElement('li');
                li.textContent = `${patient.name} (${patient.reason})`;
                queueList.appendChild(li);
            });
        }

        addBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (!name) return;

            const newPatient = {
                name: name,
                reason: reasonInput.value
            };

            state.queue.push(newPatient);
            nameInput.value = '';
            
            saveData();
            render();
        });

        nextBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (state.queue.length > 0) {
                state.current = state.queue.shift().name;
                saveData();
                render();
            } else {
                state.current = null;
                render();
            }
        });

        // Initial Load
        render();
    </script>
</body>
</html>
