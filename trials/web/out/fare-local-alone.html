<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matatu Fare Splitter</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            ring: 2px solid var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .results {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f0f9ff;
            border-radius: 8px;
            display: none; /* Hidden by default */
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        #message {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }

        .result-val {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Matatu Fare Splitter</h1>
    
    <div class="form-group">
        <label for="distance">Distance (km)</label>
        <input type="number" id="distance" placeholder="e.g. 10" step="0.1">
    </div>

    <div class="form-group">
        <label for="passengers">Number of Passengers</label>
        <input type="number" id="passengers" placeholder="e.g. 4">
    </div>

    <div class="form-group">
        <label for="period">Travel Period</label>
        <select id="period">
            <option value="offpeak">Off-Peak</option>
            <option value="peak">Peak Hours</option>
        </select>
    </div>

    <button id="calculate">Calculate Split</button>

    <div id="message"></div>

    <div id="results-container" class="results">
        <div class="result-item">
            <span>Total Fare:</span>
            <span id="total" class="result-val"></span>
        </div>
        <div class="result-item">
            <span>Per Person:</span>
            <span id="each" class="result-val"></span>
        </div>
    </div>
</div>

<script>
    document.getElementById('calculate').addEventListener('click', function() {
        // Get inputs
        const distance = parseFloat(document.getElementById('distance').value);
        const passengers = parseInt(document.getElementById('passengers').value);
        const period = document.getElementById('period').value;
        
        const messageEl = document.getElementById('message');
        const resultsContainer = document.getElementById('results-container');
        const totalEl = document.getElementById('total');
        const eachEl = document.getElementById('each');

        // Reset UI
        messageEl.style.display = 'none';
        resultsContainer.style.display = 'none';
        messageEl.textContent = '';

        // Validation
        if (isNaN(distance) || distance <= 0 || isNaN(passengers) || passengers <= 0) {
            messageEl.textContent = "Please enter valid numbers greater than zero.";
            messageEl.style.display = 'block';
            return;
        }

        // Calculation
        // Base: 50 + (12 * distance)
        let totalFare = 50 + (12 * distance);

        // Peak multiplier
        if (period === 'peak') {
            totalFare = totalFare * 1.5;
        }

        const share = totalFare / passengers;

        // Display results
        totalEl.textContent = `KES ${Math.round(totalFare)}`;
        eachEl.textContent = `KES ${Math.round(share)}`;
        
        resultsContainer.style.display = 'block';
    });
</script>

</body>
</html>
