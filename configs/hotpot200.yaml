# Larger multi-hop study: 200 HotpotQA dev questions (pilot used 30).
# The read path was fixed BEFORE this run, from the pilot and the 500-question
# retrieval study: similarity ranking + gating + entity bridging, 512 tokens
# (the multi-hop optimum of the pilot budget sweep).  Nothing was tuned on these 200.
#   camr ingest        --config configs/hotpot200.yaml
#   camr sweep-models  --config configs/hotpot200.yaml --models qwen2.5:0.5b,qwen2.5:1.5b,llama3.2:3b
#   camr run --config configs/hotpot200.yaml --condition ceiling     --benchmark hotpotqa --label kimi   (ceiling_model below)
#   camr run --config configs/hotpot200.yaml --condition ceiling_rag --benchmark hotpotqa --label kimi
seed: 13
run_dir: ../results/hotpot200
local_model: {backend: ollama, name: "qwen2.5:0.5b", max_tokens: 256, num_ctx: 4096}
ceiling_model: {backend: openai_compat, name: "kimi-k3", base_url: "https://api.moonshot.ai/v1", api_key_env: MOONSHOT_API_KEY, max_tokens: 4096, timeout_s: 300}
embedder: {backend: bge, name: BAAI/bge-small-en-v1.5, dim: 384}
memory:
  write_policy: verbatim
  retrieval_policy: similarity_only
  weights: {similarity: 1.0, recency: 0.0, importance: 0.0}
  k: 20
  token_budget: 512
  min_similarity: 0.50
  similarity_margin: 0.15
  expansion: entity
benchmarks:
  hotpotqa: {path: ../data/hotpotqa/hotpot_dev_distractor_v1.json, n: 200, extra_corpus_questions: 100}
analysis: {bootstrap: 2000, ci: 0.95, min_denominator: 0.05}
