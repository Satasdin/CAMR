name: Tests

# The engine, the terminal tools and the evaluation harness, on Apple silicon, on every push and pull request.
# No model is downloaded: the tests use their own small vaults and never call Ollama or a cloud API.
on:
  push:
    paths: ["Sources/**", "Tests/**", "Package.swift", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "Package.swift"]
  workflow_dispatch:

jobs:
  test:
    name: swift test (Apple silicon)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Run the tests and keep the log
        run: swift test 2>&1 | tee swift-test.log
      - name: Count the tests
        if: always()
        run: grep -E "Test Suite '.*\.xctest' (passed|failed)|Executed [0-9]+ tests|Test run with" swift-test.log | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-test-log-${{ github.sha }}
          path: swift-test.log
